<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Haunted House · Міні-проєкт</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1026; font-family: 'Segoe UI', system-ui, sans-serif; color: #e8e6ff; }
      #app canvas { display: block; }

      .panel {
        position: fixed;
        left: 16px;
        bottom: 16px;
        width: 260px;
        padding: 14px 16px;
        background: rgba(8, 12, 28, 0.72);
        border: 1px solid rgba(140, 160, 255, 0.25);
        border-radius: 14px;
        backdrop-filter: blur(8px);
      }
      .panel h1 { margin: 0 0 10px; font-size: 1.05rem; }
      .panel label { display: block; font-size: 0.8rem; margin: 9px 0 3px; color: #cdd4ff; }
      .panel input[type='range'] { width: 100%; accent-color: #8fd8ff; }
      .hint { position: fixed; right: 16px; top: 16px; font-size: 0.75rem; color: rgba(232,230,255,0.55); text-align: right; }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div class="panel">
      <h1>Haunted House · налаштування</h1>
      <label>Густина туману</label>
      <input id="fog-density" type="range" min="0.01" max="0.08" step="0.005" value="0.03" />
      <label>Швидкість привидів</label>
      <input id="ghost-speed" type="range" min="0.2" max="3" step="0.1" value="1" />
      <label>Світло біля дверей</label>
      <input id="door-light" type="range" min="0" max="6" step="0.1" value="2" />
      <label>Яскравість місяця</label>
      <input id="moon-light" type="range" min="0" max="3" step="0.05" value="1" />
      <label>Висота сонця (Sky)</label>
      <input id="sun-elevation" type="range" min="0" max="90" step="1" value="20" />
      <label>Повтор текстури трави</label>
      <input id="grass-repeat" type="range" min="1" max="20" step="1" value="8" />
    </div>

    <div class="hint">Drag — обертання · Scroll — зум<br />ПКМ drag — панорама</div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
